# 部署：五十音练习站 → GitHub Pages
#
# 说明：
#  - 本站是纯静态网站（HTML / CSS / JS），没有构建步骤，不需要 npm install。
#  - 使用 GitHub 官方 Pages 部署方式，权限来自内置 GITHUB_TOKEN，不使用任何个人令牌（已移除旧的 secrets.TOKEN）。
#  - 只上传 site/ 目录，仓库里的 .git、备份、旧博客文章、node_modules 都不会被发布。
#  - 旧流程（Hexo 构建后推送到 gh-pages 分支）已停用，gh-pages 分支本身保留未删除。

name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
